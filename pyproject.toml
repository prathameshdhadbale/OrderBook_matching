
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-book-matching"
version = "0.1.0"
description = "A Python limit order book and matching engine with price-time priority"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools]
py-modules = ["matching", "order_book"]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]
